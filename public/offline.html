<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0b2340">
    <title>Spectra • Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b2340; color: #fff8e8; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      main { max-width: 460px; padding: 36px; border: 1px solid #d8b45c66; border-radius: 24px; background: #ffffff0a; }
      h1 { margin: 0 0 8px; color: #f4d57a; }
      p { margin: 8px 0; color: #dbe4ef; }
      a { display: inline-block; margin-top: 18px; padding: 10px 18px; border-radius: 12px; background: #e7c66d; color: #0b2340; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Spectra is offline</h1>
      <p>The exhibition passport needs an internet connection to register visitors, save stamps and issue certificates.</p>
      <p>Reconnect to Wi-Fi or mobile data, then return to the exhibition app.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
